version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: timeline-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: timeline
      MYSQL_USER: timeline
      MYSQL_PASSWORD: timeline123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: timeline-server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: timeline
      DB_PASSWORD: timeline123
      DB_NAME: timeline
      JWT_SECRET: change-me-to-a-random-secret-in-production
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: timeline-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mysql_data:
